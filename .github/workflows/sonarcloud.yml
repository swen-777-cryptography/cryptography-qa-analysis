name: SonarQube Cloud Scan

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  push:
    branches: ["main"]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Disabling shallow clones is recommended for accurate blame info

      - name: Install Rust and Clippy
        run: |
          rustup update stable
          rustup component add clippy

      - name: Generate Sonar generic coverage XML
        run: python3 .github/bin/generate_sonar_coverage.py

      - name: Official SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}



