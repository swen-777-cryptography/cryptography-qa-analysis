name: Semgrep Static Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required for GitHub Advanced Security / SARIF tab
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/security-audit
            p/python
            p/rust
          generateSarif: "1"

      - name: Upload SARIF output
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif